services:
  - type: web
    name: petshop-grooming
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: petshop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/petshop.db
      - key: LOGS_DIR
        value: /var/data/logs
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: CORS_ORIGINS
        value: https://bonaobrarowen.github.io
      - key: LOW_STOCK_DEFAULT
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
